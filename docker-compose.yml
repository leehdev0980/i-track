services:
  mysql:
    image: mysql:8.4
    container_name: i-track-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: i_track
      MYSQL_USER: i_track_app
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "i_track_app",
          "-papppassword"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: i-track-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://i_track_app:apppassword@mysql:3306/i_track
      SHADOW_DATABASE_URL: mysql://i_track_app:apppassword@mysql:3306/prisma_shadow
      JWT_SECRET: change-this-before-deployment
    ports:
      - "3000:3000"

volumes:
  mysql_data:
